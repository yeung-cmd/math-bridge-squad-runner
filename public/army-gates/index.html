<style>

  .panel h1{margin:0 0 4px;font-size:32px;font-weight:900;color:#e2591b;text-shadow:0 2px 0 #ffd23f}
  .panel p{margin:4px 0 12px;color:#5a4630;font-size:15px}

  .row .lab{font-weight:900;color:#1c4f9c;font-size:16px;margin-bottom:6px;text-align:left}

  .opt.on{background:#2f8cf0;border-color:#1a5bb0;color:#fff}
  textarea{width:100%;height:110px;border-radius:12px;border:3px solid #9fb4d4;padding:8px;font-size:16px;font-family:inherit;user-select:text;-webkit-user-select:text}
  details{text-align:left;margin-top:10px}
  summary{font-weight:900;color:#1c4f9c;font-size:16px;cursor:pointer}
  .note{font-size:13px;color:#7a6650;margin:6px 0 0;text-align:left}
  .big{margin-top:16px;width:100%;padding:14px;border:none;border-radius:16px;background:#ff9a1f;color:#fff;font-size:24px;font-weight:900;
    box-shadow:0 6px 0 #c4600a;font-family:inherit}
  .big:active{transform:translateY(4px);box-shadow:0 2px 0 #c4600a}
  .big.blue{background:#2f8cf0;box-shadow:0 6px 0 #1a5bb0}
  #log{text-align:left;background:#fff;border-radius:12px;padding:8px 12px;margin-top:10px;font-size:17px;color:#333;max-height:180px;overflow:auto;border:2px solid #e8d7b4}

  .stat{display:flex;justify-content:space-around;margin:10px 0}

</style>

  #feedback.good{background:#2fb24c;color:#fff;box-shadow:0 4px 0 #1b7a30}

<script>
(() => {
'use strict';
// ---------------- 設定 ----------------
const CHAPTERS = {
  '1': {
    badge: '第一章・晴天守橋',
    title: '碧海橋頭',
    hudName: '第一章・碧海橋頭',
    story: '紅角先鋒突襲碧海石橋！指揮官，請帶領弓箭隊穿過最有利的數學大門，壯大軍團擊退先鋒戰將！',
    tip: '戰術重點：左右比較加減門，答對大炮可展開機關掃射擊退一半敵兵！',
    enemyImg: './art/warlord.webp',
    shieldRate: 0,
    giantActive: false,
    giantGap: 11,
    dualBoss: false,
    quizChoices: 2,
    bossScale: 1.0,
    medalName: '🥉 第一章碧海銅盾勳章'
  },
  '2': {
    badge: '第二章・黃昏圍城',
    title: '烽火圍城',
    hudName: '第二章・烽火圍城',
    story: '黃昏烽火燃起！敵方派出左右護衛巨人與重裝盾兵壓境，隨時從橋側召喚增援包抄我軍！',
    tip: '戰術重點：盾兵較耐打；答對大炮可掃射敵軍並壓制雙巨人 7 秒！',
    enemyImg: './art/giant.webp',
    shieldRate: 0.25,
    giantActive: true,
    giantGap: 10.5,
    dualBoss: false,
    quizChoices: 2,
    bossScale: 1.2,
    medalName: '🥈 第二章烽火銀劍勳章'
  },
  '3': {
    badge: '第三章・暗夜終戰',
    title: '暗夜魔王',
    hudName: '第三章・暗夜魔王',
    story: '黑夜雷電交加，城堡傳送門即將開啟！打倒先鋒魔將後，更強大的暗夜巨王將從後方破門殺出！',
    tip: '戰術重點：留意止損雙減門與複合乘法門；答題大炮升級為三選一！',
    enemyImg: './art/overlord.webp',
    shieldRate: 0.35,
    giantActive: true,
    giantGap: 9.2,
    dualBoss: true,
    quizChoices: 3,
    bossScale: 1.3,
    medalName: '👑 第三章暗夜金冠勳章'
  }
};
const cfg = { level:'1', range:20, speed:'easy', quizSeconds:5 };
try { const s = JSON.parse(localStorage.getItem('armyMathCfg2')||'null'); if (s) Object.assign(cfg, s); } catch(e){}
if (!['1','2','3'].includes(String(cfg.level))) cfg.level='1';
cfg.level = String(cfg.level);
if (![0,3,5].includes(cfg.quizSeconds)) cfg.quizSeconds=5;
if (!['easy','mid','hard'].includes(cfg.speed)) cfg.speed='easy';
function loadMedals(){
  try { const m=JSON.parse(localStorage.getItem('armyMathMedals1')||'{}'); return m && typeof m==='object' ? m : {}; }
  catch(e){ return {}; }
}
let medals = loadMedals();
function saveMedal(lv){
  medals[lv] = true;
  try { localStorage.setItem('armyMathMedals1', JSON.stringify(medals)); } catch(e){}
  renderMedals();
}
function renderMedals(){
  const count=['1','2','3'].filter(k=>medals[k]).length;
  const summary=document.getElementById('medalSummary');
  if (summary) {
    if (count===3) summary.innerHTML='<span class="medal-crown">👑 王國守護者（3 / 3）</span>';
    else summary.textContent=`通關勳章：${count} / 3`;
  }
  document.querySelectorAll('.medal-pill').forEach(el=>{
    el.classList.toggle('earned', !!medals[el.dataset.medal]);
  });
  document.querySelectorAll('.opts-chapters .opt').forEach(btn=>{
    btn.classList.toggle('has-medal', !!medals[btn.dataset.v]);
  });
}
function syncOptionButtons(){
  document.querySelectorAll('.opts').forEach(g => {
    const k = g.dataset.k;
    g.querySelectorAll('.opt').forEach(b => {
      b.classList.toggle('on', String(cfg[k]) === b.dataset.v);
      b.onclick = () => { g.querySelectorAll('.opt').forEach(x=>x.classList.remove('on')); b.classList.add('on');
        cfg[k] = (k==='range' || k==='quizSeconds') ? +b.dataset.v : b.dataset.v; };
    });
  });
}
syncOptionButtons();
renderMedals();
const SPEEDS = {
  easy:{ life:3.5, horde:60,  refill:3, hordeSpeed:0.6, enemySpeed:1.1, bossSpeed:0.15, bossHP:2500, heal:40 },
  mid: { life:2.5, horde:105, refill:6,   hordeSpeed:0.8, enemySpeed:1.4, bossSpeed:0.16, bossHP:3200, heal:80 },
  hard:{ life:2.0, horde:160, refill:12,   hordeSpeed:1.0, enemySpeed:1.8, bossSpeed:0.17, bossHP:4000, heal:120 }
};
const ENEMY_LIMIT=260;
const FIRST_QUIZ_AT=6;
const QUIZ_GAP=[8,11];
const R = (a,b) => a + Math.floor(Math.random()*(b-a+1));
// ---------------- 音效 ----------------
let actx=null, noiseBuf=null;
function getNoiseBuffer(){
  if(!actx) return null;
  if(!noiseBuf){
    const len=Math.floor(actx.sampleRate*0.2);
    noiseBuf=actx.createBuffer(1,len,actx.sampleRate);
    const data=noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++) data[i]=Math.random()*2-1;
  }
  return noiseBuf;
}
function beep(f,d=0.08,type='square',vol=0.05){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=f; g.gain.value=vol;
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+d);
  o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+d);
}
function playCannonSpinUp(){
  if(!actx) return;
  const now=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='sawtooth';
  o.frequency.setValueAtTime(140,now);
  o.frequency.exponentialRampToValueAtTime(440,now+0.26);
  g.gain.setValueAtTime(0.02,now);
  g.gain.linearRampToValueAtTime(0.09,now+0.22);
  g.gain.exponentialRampToValueAtTime(0.0001,now+0.28);
  o.connect(g); g.connect(actx.destination); o.start(now); o.stop(now+0.28);
}
function playGatlingBeat(){
  if(!actx) return;
  const now=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='triangle';
  o.frequency.setValueAtTime(105,now);
  o.frequency.exponentialRampToValueAtTime(42,now+0.055);
  g.gain.setValueAtTime(0.08,now);
  g.gain.exponentialRampToValueAtTime(0.0001,now+0.06);
  o.connect(g); g.connect(actx.destination); o.start(now); o.stop(now+0.062);

  const buf=getNoiseBuffer();
  if(buf){
    const src=actx.createBufferSource();
    src.buffer=buf;
    const bp=actx.createBiquadFilter();
    bp.type='bandpass'; bp.frequency.value=1250; bp.Q.value=1.2;
    const ng=actx.createGain();
    ng.gain.setValueAtTime(0.05,now);
    ng.gain.exponentialRampToValueAtTime(0.0001,now+0.045);
    src.connect(bp); bp.connect(ng); ng.connect(actx.destination);
    src.start(now); src.stop(now+0.05);
  }
}
function playCannonCooldown(){
  if(!actx) return;
  const now=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(220,now);
  o.frequency.exponentialRampToValueAtTime(52,now+0.34);
  g.gain.setValueAtTime(0.11,now);
  g.gain.exponentialRampToValueAtTime(0.0001,now+0.36);
  o.connect(g); g.connect(actx.destination); o.start(now); o.stop(now+0.37);
}
function playBossEntrance(){
  if(!actx) return;
  const now=actx.currentTime;
  [110, 146.8, 164.8, 220].forEach((freq,idx)=>{
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=idx===0?'sawtooth':'triangle';
    o.frequency.setValueAtTime(freq,now);
    o.frequency.exponentialRampToValueAtTime(freq*0.72,now+0.75);
    g.gain.setValueAtTime(idx===0?0.09:0.055,now);
    g.gain.exponentialRampToValueAtTime(0.0001,now+0.78);
    o.connect(g); g.connect(actx.destination); o.start(now); o.stop(now+0.8);
  });
}

// ---------------- Three.js 場景 ----------------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.outputEncoding=THREE.sRGBEncoding;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ec7c7);
scene.fog = new THREE.Fog(0x9ec7c7, 54, 118);
const camera = new THREE.PerspectiveCamera(60, 1, 0.5, 300);
camera.position.set(0, 21, 17);
camera.lookAt(0, 0, -9);
function resize(){
  const w=innerWidth, h=innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  const f = 2*Math.atan(0.335/camera.aspect)*180/Math.PI;
  camera.fov = Math.max(42, Math.min(78, f));
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const hemi = new THREE.HemisphereLight(0xffffff, 0x6a5a48, 0.62); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 0.55); sun.position.set(-10, 30, 15); scene.add(sun);

const L = { X:-6.4, C:0, RX:6.4, SIDE_W:4.4, CEN_W:6.8, EXIT:-4, SQUAD_Z:4.2 };
const lam = c => new THREE.MeshLambertMaterial({color:c});
const cannon = createQuizCannon(scene,camera);
const landscape = armyArt.landscape(scene,L,{hemi,sun});
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const warlordFigure = armyArt.marchingFigure('warlord',5.8,6.4);
const overlordFigure = armyArt.marchingFigure('overlord',6.3,7.0);

// ---------------- 文字精靈 ----------------
function drawLabel(cv, text, o){
  const size=o.size||96, color=o.color||'#fff', stroke=o.stroke||'#1b1b1b';
  const cx=cv.getContext('2d');
  const font=`900 ${size}px 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif`;
  cx.clearRect(0,0,cv.width,cv.height);
  cx.font=font; cx.textAlign='center'; cx.textBaseline='middle';
  cx.lineJoin='round'; cx.lineWidth=size*0.16; cx.strokeStyle=stroke;
  cx.strokeText(text, cv.width/2, cv.height/2); cx.fillStyle=color; cx.fillText(text, cv.width/2, cv.height/2);
}
function textSprite(text, o={}){
  const size=o.size||96;
  const cv=document.createElement('canvas'), cx=cv.getContext('2d');
  cx.font=`900 ${size}px 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif`;
  const minW = o.minChars ? cx.measureText('8'.repeat(o.minChars)).width : 0;
  const w=Math.ceil(Math.max(cx.measureText(text).width, minW))+size*0.5;
  cv.width=w; cv.height=Math.ceil(size*1.4);
  drawLabel(cv, text, o);
  const tex=new THREE.CanvasTexture(cv); tex.anisotropy=4;
  const mat=new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false});
  const sp=new THREE.Sprite(mat); const h=o.h||1.2; sp.scale.set(h*w/cv.height, h, 1);
  sp.renderOrder=10; sp.userData={cv, o, text}; return sp;
}
// 數字標籤：只標記需要更新，每格畫面最多重畫一次（避免每箭重建貼圖）
const dirtyLabels=new Set();
function setSpriteText(sp, text){ if (sp.userData.text===text) return; sp.userData.text=text; dirtyLabels.add(sp); }
function flushLabels(){ dirtyLabels.forEach(sp=>{ drawLabel(sp.userData.cv, sp.userData.text, sp.userData.o); sp.material.map.needsUpdate=true; }); dirtyLabels.clear(); }

// ---------------- 選擇門 ----------------
// 門的數值：{op:'+'|'−'|'×', n}
const apply = (army, g) => g.op==='+' ? army+g.n : g.op==='−' ? army-g.n : army*g.n;
const gText = g => g.label || (g.op + g.n);
function genGate(other){
  const M=cfg.range, lv=cfg.level;
  const army = G ? G.army : 0;
  const plus = () => ({op:'+', n:R(1,M)});
  const minus= () => ({op:'−', n:R(1,M)});
  // 乘法：士兵少（50或以下）時才出「×2／×3」；士兵多時改為「+3×4」（加 3 組，每組 4 人），乘數保持在乘數表範圍內
  const fmax = M<=10 ? 5 : 9;
  const timesArmy = () => ({op:'×', n: (army*3>150 || Math.random()<0.65) ? 2 : 3});
  const groupGate = (sign) => { let a=R(2,fmax), b=R(2,fmax); if (M<=20) while(a*b>M*2){ a=R(2,fmax); b=R(2,fmax); }
    return {op:sign, n:a*b, label:`${sign}${a}×${b}`}; };
  let g;
  if (lv==='3'){
    const r=Math.random();
    const mulOK = army <= 50;
    if (!other && army>=18 && r<0.28) {
      g = Math.random()<0.4 ? groupGate('−') : minus();
    } else if (other && other.op==='−' && army>=18 && r<0.38) {
      g = Math.random()<0.4 ? groupGate('−') : minus();
    } else if (other && (other.op==='×' || other.label)) {
      g = r<0.45 ? groupGate('+') : (r<0.75 ? plus() : minus());
    } else if (r<0.52) {
      g = mulOK && Math.random()<0.5 ? timesArmy() : groupGate(Math.random()<0.72?'+':'−');
    } else {
      g = r<0.78 ? plus() : minus();
    }
  } else if (lv==='2'){
    const r=Math.random();
    const mulOK = army <= 50;
    if (other && (other.op==='×' || other.label)) g = r<0.55 ? plus() : minus();
    else if (r<0.45) g = mulOK && Math.random()<0.6 ? timesArmy() : groupGate(Math.random()<0.7?'+':'−');
    else g = r<0.75 ? plus() : minus();
  } else {
    if (other && other.op==='+') g = Math.random()<0.55 ? minus() : plus();
    else if (other && other.op==='−') g = Math.random()<0.75 ? plus() : minus();
    else g = Math.random()<0.6 ? plus() : minus();
  }
  if (other && apply(army,other)===apply(army,g)) {
    if (g.op==='×') g.n = g.n===2 ? 3 : 2;
    else { g.n = (g.n%M)+1; delete g.label; }
  }
  return g;
}
const GATE_COL = { '+':[0x2f8cf0,0x6db8ff,'#103f86'], 'g':[0x8a4fe0,0xc4a0ff,'#3d1680'], '−':[0xe0413a,0xff8a80,'#7a0f0a'], '×':[0x8a4fe0,0xc4a0ff,'#3d1680'] };
function makeGateMesh(g){
  const [c1,c2,st]=GATE_COL[g.label ? 'g' : g.op];
  const grp=new THREE.Group();
  const post=(x)=>{ const p=new THREE.Mesh(new THREE.BoxGeometry(0.35,3.2,0.35), lam(0x6b6f78)); p.position.set(x,1.6,0); grp.add(p); };
  post(-1.95); post(1.95); armyArt.gateTrim(grp);
  const panel=new THREE.Mesh(new THREE.BoxGeometry(3.6,2.2,0.25), new THREE.MeshLambertMaterial({color:c1, transparent:true, opacity:0.85}));
  panel.position.y=1.9; grp.add(panel);
  const rim=new THREE.Mesh(new THREE.BoxGeometry(3.9,0.3,0.4), lam(c2)); rim.position.y=3.1; grp.add(rim);
  const lab=textSprite(gText(g),{size:120,h:g.label?1.6:1.9,stroke:st}); lab.position.set(0,2.1,0.4); grp.add(lab);
  // 倒數條
  const barBg=new THREE.Mesh(new THREE.BoxGeometry(3.4,0.22,0.1), new THREE.MeshBasicMaterial({color:0x222222})); barBg.position.set(0,0.55,0.3); grp.add(barBg);
  const bar=new THREE.Mesh(new THREE.BoxGeometry(3.4,0.22,0.12), new THREE.MeshBasicMaterial({color:0xffd23f})); bar.position.set(0,0.55,0.32); grp.add(bar);
  return {grp,panel,bar,lab};
}

function chooseGate(side){
  const s=G.gates[side]; if(!s.g || s.z < GATE_Z-3) return;   // 門未到位不可選
  const o=G.gates[side==='L'?'R':'L'];
  const before=G.army, after=Math.max(0,Math.min(999,apply(before,s.g)));
  let best=true, better=null;
  if (o.g && o.z > GATE_Z-3){ const alt=apply(before,o.g); if (alt>apply(before,s.g)){ best=false; better=o.g; } }
  else if (apply(before,s.g) < before){ best=false; }
  G.lastGate=G.t;
  G.total++; if(best) G.good++;
  G.army=after; G.maxArmy=Math.max(G.maxArmy,G.army);
  const opTxt = s.g.label ? `${s.g.op} (${s.g.label.slice(1)})` : `${s.g.op} ${s.g.n}`;
  const line=`${before} ${opTxt} = ${apply(before,s.g)}`;
  G.log.push({line, best, better: better ? gText(better) : null});
  const wx=SIDES[side].x;
  floatText(`${before}${opTxt.replace(/ /g,'')}=${after}`, Math.max(-4.2,Math.min(4.2,wx)), 4.4, GATE_Z, {size:110,h:1.5,color:'#fff',stroke:GATE_COL[s.g.label?'g':s.g.op][2],life:1.1,vy:2.2});
  burst(wx,2,GATE_Z, s.g.op==='−'?0xff8a80:0xffd23f, 22, 6);
  if (best){ feedback(better===null && s.g.op==='−' ? '✓' : '✓ 好選擇！', true); beep(660,0.1); setTimeout(()=>beep(880,0.12),90);
    if (G.good%5===0 && G.level<4){ G.level++; floatText('攻擊力 +20%',Math.max(-4,Math.min(4,G.sx)),3.4,L.SQUAD_Z,{size:96,h:1.4,color:'#ffd23f',stroke:'#8a3b00',life:1.6}); }
  } else { feedback(better ? `另一邊 ${gText(better)} 會更多` : '士兵減少了！', false); beep(200,0.2,'sawtooth',0.04);
    G.boss.hp = Math.min(G.boss.max, G.boss.hp + G.S.heal); setSpriteText(G.boss.label,String(Math.ceil(G.boss.hp)));
    floatText('首領回復 +'+G.S.heal,0,7.5,G.boss.z,{size:96,h:1.3,color:'#ff6b6b',stroke:'#4a0000',life:1.4}); }
  clearGate(side); s.wait=0.5;
  updateHud();
}

const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(), plane=new THREE.Plane(new THREE.Vector3(0,1,0),0), hit=new THREE.Vector3();

function setRay(cx,cy){ ndc.set(cx/innerWidth*2-1, -(cy/innerHeight)*2+1); ray.setFromCamera(ndc,camera); }
function worldXAt(cx,cy){ setRay(cx,cy); return ray.ray.intersectPlane(plane,hit) ? hit.x : 0; }

// ---------------- 主循環 ----------------
function squadRadius(){ return 0.31*Math.sqrt(Math.min(G.army,160))+0.35; }
function fire(dt){
  G.volley-=dt; if (G.volley>0) return;
  G.volley = Math.max(0.22, 0.3 - G.level*0.02);
  const shown=Math.min(G.army,160); if(!shown) return;
  const n=Math.min(24, Math.ceil(G.army/12)) + G.level;
  for(let k=0;k<n;k++){
    const a=arrows.find(a=>!a.on); if(!a) break;
    const s=G.slots[Math.floor(Math.random()*shown)];
    a.on=true; a.x=s.x+(Math.random()-.5)*0.2; a.y=1.2; a.z=s.z-0.3;
  }
  if (Math.random()<0.5) beep(900+Math.random()*200,0.03,'triangle',0.012);
}
function step(dt){
  const protectedTime=!!quiz;
  if (protectedTime) dt*=.25;
  const S=G.S; G.t+=dt;
  G.sx += (G.tx-G.sx)*Math.min(1,dt*10);
  const shown=Math.min(G.army,160);
  for(let i=0;i<shown;i++){ const r=0.31*Math.sqrt(i), th=i*2.39996; const s=G.slots[i];
    const tx=G.sx+Math.cos(th)*r, tz=L.SQUAD_Z+Math.sin(th)*r*0.8;
    s.x+=(tx-s.x)*Math.min(1,dt*8); s.z+=(tz-s.z)*Math.min(1,dt*8); }
  if (!protectedTime) {
    fire(dt);
    // 選擇門：滑入、倒數、消失
    for (const side of ['L','R']){ const s=G.gates[side];
      if (!s.g){ s.wait-=dt; if (s.wait<=0) spawnGate(side); continue; }
      s.z += (GATE_Z - s.z)*Math.min(1,dt*7); s.mesh.grp.position.z=s.z;
      if (s.z > GATE_Z-3){ s.age+=dt; const k=Math.max(0,1-s.age/S.life);
        s.mesh.bar.scale.x=Math.max(0.001,k); s.mesh.bar.position.x=-1.7*(1-k);
        s.mesh.bar.material.color.setHex(k<0.35?0xff5a3a:0xffd23f);
        if (s.age>=S.life){ expireGate(side); } }
    }
    // 行入左右步道 = 選擇該邊的門（要先返回中間才可再選）
    const zone = G.sx < -3.9 ? 'L' : G.sx > 3.9 ? 'R' : 'C';
    if (zone!==G.zone){ if (zone!=='C') chooseGate(zone); G.zone=zone; }
  }
  // 逐步補充橋上的敵兵，預留空間給已越過橋口的敵兵。
  const target = Math.min(ENEMY_LIMIT-18, Math.floor(S.horde+G.t*0.85));
  G.spawn+=dt*S.refill;
  let inLane=0;
  for(const enemy of G.enemies) if(enemy.z<L.EXIT) inLane++;
  while(G.spawn>=1){
    const waveSize=Math.min(6,target-inLane,ENEMY_LIMIT-G.enemies.length);
    if(waveSize<=0){G.spawn=0;break;}
    G.spawn--;
    const firstColumn=R(0,6-waveSize);
    for(let k=0;k<waveSize;k++){
      pushEnemy(-2.8+(firstColumn+k)*1.12+(Math.random()-.5)*.3, G.boss.z+2.6+Math.random()*2.5);
    }
    inLane+=waveSize;
  }
  // 第二／三章：左右兩側巨人召喚增援（被機關炮壓制期間暫停）
  if (!protectedTime && G.chapter.giantActive){
    if (G.giantStun > 0) {
      G.giantStun = Math.max(0, G.giantStun - dt);
    } else if (G.t >= G.giantNext) {
      G.giantNext = G.t + G.chapter.giantGap;
      const sideIdx = G.giantSide; G.giantSide = 1 - G.giantSide;
      const gp = landscape.getGiantPos(sideIdx);
      landscape.pulseGiant(sideIdx, 0xd88cff);
      const spawnZ = Math.max(-24, Math.min(L.EXIT - 3, gp.z + 1.5));
      for (let k=0; k<4; k++) {
        pushEnemy((sideIdx===0?-2.2:1.2)+k*0.42+(Math.random()-.5)*0.25, spawnZ+Math.random()*1.2, k<2?'shield':'raider');
      }
      floatText('巨人召喚援軍！', sideIdx===0?-3.0:3.0, 4.8, Math.max(-20, gp.z), {size:96,h:1.35,color:'#e5b8ff',stroke:'#3a0e68',life:1.5});
      beep(310,0.16,'triangle',0.06);
    }
  }
  // 中路道具：炸藥桶（射爆清走附近敵兵）、寶箱（射爆加士兵）
  G.propT-=dt;
  if (G.propT<=0){ G.propT = R(9,14); spawnProp(Math.random()<0.5 ? 'barrel' : 'chest'); }
  for (let i=G.props.length-1;i>=0;i--){ const p=G.props[i]; p.z += S.hordeSpeed*dt; p.grp.position.z=p.z;
    p.grp.rotation.y = p.type==='chest' ? Math.sin(G.t*2)*0.2 : 0;
    if (p.z > L.EXIT){ scene.remove(p.grp); G.props.splice(i,1); } }
  G.boss.z += S.bossSpeed*dt; G.boss.grp.position.z=G.boss.z; G.boss.grp.rotation.y=Math.sin(G.t*1.5)*0.08;
  const rad=squadRadius();
  for (let i=G.enemies.length-1;i>=0;i--){ const e=G.enemies[i];
    const spdScale = e.kind==='shield' ? 0.85 : 1;
    if (e.z < L.EXIT) { e.z += S.hordeSpeed*spdScale*dt*(e.z > G.boss.z+12 ? 1.6 : 1); e.x=Math.max(-3,Math.min(3,e.x)); }
    else { e.z += S.enemySpeed*spdScale*dt*0.7; }
    if (e.z < L.EXIT) {}
    else { const dx=G.sx-e.x, dz=L.SQUAD_Z-e.z, d=Math.hypot(dx,dz)||1;
      e.x+=dx/d*S.enemySpeed*spdScale*dt*0.9; e.z+=dz/d*S.enemySpeed*spdScale*dt*0.3;
      if (!protectedTime && d < rad+0.3){ G.enemies.splice(i,1); G.army-=1; burst(e.x,0.8,e.z,0xffffff,6,3); beep(180,0.06,'sawtooth',0.03); continue; } }
    if (e.z > L.SQUAD_Z+6) G.enemies.splice(i,1);
  }
  // 箭矢（左右步道的箭不會打門；只有中路有效）
  if (protectedTime) return;
  const bossZ=G.boss.z, dmg=1+G.level*0.25;
  for (const a of arrows){ if(!a.on) continue;
    a.z -= 46*dt;
    if (a.z < -95){ a.on=false; continue; }
    if (Math.abs(a.x) > 3.6){ if (a.z < GATE_Z+0.5) a.on=false; continue; }
    let hitP=false;
    for (const p of G.props){ if (Math.abs(p.x-a.x)<1.0 && a.z < p.z+0.8 && a.z > p.z-1.2){ a.on=false; hitP=true; p.hp-=dmg; p.flash=0.06;
        setSpriteText(p.label,String(Math.max(0,Math.ceil(p.hp)))); if (p.hp<=0) breakProp(p); break; } }
    if (hitP) continue;
    let hitE=-1;
    for (let i=0;i<G.enemies.length;i++){ const e=G.enemies[i]; if (Math.abs(e.x-a.x)<0.46 && Math.abs(e.z-a.z)<0.65){ hitE=i; break; } }
    if (hitE>=0){ const e=G.enemies[hitE]; a.on=false; e.hp-=dmg;
      if (e.hp<=0){ G.enemies.splice(hitE,1); burst(e.x,0.8,e.z,e.kind==='shield'?0x9ec8ff:0xffe066,6,3.5); }
      else if (e.kind==='shield'){ burst(e.x,0.95,e.z,0xcbe7ff,2,2.5); }
      continue; }
    if (Math.abs(a.x)<2.6 && a.z < bossZ+1.2){ a.on=false; G.boss.hp-=dmg; G.boss.flash=0.06;
      setSpriteText(G.boss.label,String(Math.max(0,Math.ceil(G.boss.hp))));
      if (G.boss.hp<=0) {
        if (G.chapter.dualBoss && G.bossPhase===1) summonOverlord();
        else return endGame(true);
      } }
  }
  if (G.army<=0){ G.army=0; return endGame(false); }
  if (G.boss.z > L.EXIT-1.5) return endGame(false);
}

function render(dt){
  if (G){
    const shown=Math.min(G.army,160);
    for(let i=0;i<shown;i++){ const s=G.slots[i]; const bob=Math.abs(Math.sin(G.t*9+i))*0.06;
      armyArt.soldier(camera,blueArmy,i,s.x,s.z,bob); }
    armyArt.flush(blueArmy,shown);
    let nr=0, ns=0;
    for(let i=0;i<G.enemies.length;i++){
      const e=G.enemies[i];
      const bob=Math.abs(Math.sin(G.t*8+e.ph))*0.08;
      if (e.kind==='shield' && ns<120) armyArt.soldier(camera,shieldArmy,ns++,e.x,e.z,bob*0.85);
      else if (nr<ENEMY_LIMIT) armyArt.soldier(camera,redArmy,nr++,e.x,e.z,bob);
    }
    armyArt.flush(redArmy,nr);
    armyArt.flush(shieldArmy,ns);
    const showBattleLabels = quiz?.phase!=='shot' || reducedMotion.matches;
    G.boss.label.visible=G.armyLabel.visible=showBattleLabels;
    for (const prop of G.props) prop.label.visible=showBattleLabels;
    const bossTravel = G.boss.z + 28;
    landscape.animate(camera, G.t, bossTravel, reducedMotion.matches, dt);
    G.boss.fig.pose(camera, bossTravel * 10, reducedMotion.matches ? 0 : 1);
    setSpriteText(G.armyLabel,String(G.army));
    G.armyLabel.position.set(G.sx, 2.4+squadRadius()*0.2, L.SQUAD_Z-squadRadius()-0.5);
    G.boss.fig.body.material.color.setHex(G.boss.flash>0?0xffc6a1:0xffffff); G.boss.flash-=dt;
    for (const side of ['L','R']){ const s=G.gates[side]; if(s.mesh) s.mesh.lab.position.y=2.1+Math.sin(G.t*5)*0.06; }
  }
  let ai=0; for (const a of arrows){ if(!a.on) continue; dummy.position.set(a.x,a.y,a.z); dummy.rotation.set(0,0,0); dummy.updateMatrix(); arrowMesh.setMatrixAt(ai++,dummy.matrix); }
  arrowMesh.count=ai; arrowMesh.instanceMatrix.needsUpdate=true;
  for (let i=0;i<MAXP;i++){ const p=parts[i]; if(!p.on){ dummy.position.set(0,-50,0); dummy.updateMatrix(); pMesh.setMatrixAt(i,dummy.matrix); continue; }
    p.life-=dt; if(p.life<=0){p.on=false; continue;} p.vy-=9*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
    dummy.position.set(p.x,p.y,p.z); dummy.rotation.set(p.life*8,p.life*6,0); dummy.scale.setScalar(Math.min(1,p.life*2)); dummy.updateMatrix(); pMesh.setMatrixAt(i,dummy.matrix); dummy.scale.setScalar(1); }
  pMesh.instanceMatrix.needsUpdate=true;
  for (let i=floats.length-1;i>=0;i--){ const f=floats[i]; f.life-=dt; f.sp.position.y+=f.vy*dt; f.sp.material.opacity=Math.min(1,f.life*1.5);
    if (f.life<=0){ scene.remove(f.sp); f.sp.material.map.dispose(); f.sp.material.dispose(); floats.splice(i,1); } }
  flushLabels();
  renderer.render(scene,camera);
}

const quizCard=document.getElementById('quizCard');
const quizButtons=[...document.querySelectorAll('#quizChoices button')];
let quiz=null;
function clearQuiz(){
  quiz=null; quizCard.hidden=true; cannon.hide();
  document.body.classList.remove('cannon-firing','cannon-burst');
}
function offerQuiz(){
  if(!cfg.quizSeconds || !G.total || G.t<G.quizNext || dragging ||
      Math.abs(G.tx-G.sx)>.12 || G.t-G.lastGate<1.4 || G.enemies.length<3) return;
  const q=G.nextMath();
  quiz={q,phase:'question',remaining:cfg.quizSeconds,deadline:null,age:0};
  $('hint').style.display='none';
  $('quizMath').textContent=q.expression+' = ?';
  $('quizClock').textContent=cfg.quizSeconds+' 秒';
  $('quizTimer').max=cfg.quizSeconds; $('quizTimer').value=cfg.quizSeconds;
  $('quizTimer').hidden=false; $('quizResult').textContent='';
  $('quizChoices').hidden=false;
  quizButtons.forEach((b,i)=>{
    const has=i<q.options.length;
    b.hidden=!has;
    if(has){ b.textContent=q.options[i]; b.disabled=false; }
  });
  quizCard.hidden=false;
  beep(660,.12,'sine');
}
function answerQuiz(value){
  if(!quiz || quiz.phase!=='question' || paused || !running) return;
  if(quiz.deadline!==null && performance.now()>=quiz.deadline) value=null;
  const q=quiz.q, correct=value===q.answer;
  G.quizLog.push({expression:q.expression,answer:q.answer,chosen:value});
  quiz.phase=correct?'shot':'result';quiz.age=0;
  $('quizMath').textContent=q.expression+' = '+q.answer;
  $('quizTimer').hidden=true; $('quizChoices').hidden=true;
  quizButtons.forEach(b=>b.disabled=true);
  $('quizClock').textContent='';
  $('quizResult').textContent=correct?'答對了！機關炮啟動！':value===null?'時間到，看看正確答案。':'再試一次，看看正確答案。';
  if(correct){
    cannon.start(G,reducedMotion.matches);
    document.body.classList.add('cannon-firing');
    playCannonSpinUp();
    if(G.chapter.giantActive){
      G.giantStun=7;
      landscape.setGiantStun(7);
      floatText('雙巨人遭到壓制！',0,5.2,-16,{size:96,h:1.4,color:'#9efffa',stroke:'#0c3f58',life:1.6});
    }
  }else beep(300,.12,'sine');
}
quizButtons.forEach((b,i)=>b.addEventListener('click',()=>{if(quiz) answerQuiz(quiz.q.options[i]);}));
function quizTick(now,dt){
  if(!quiz){offerQuiz();return;}
  if(quiz.phase==='question'){
    if(quiz.deadline===null) quiz.deadline=now+quiz.remaining*1000;
    quiz.remaining=Math.max(0,(quiz.deadline-now)/1000);
    $('quizTimer').value=quiz.remaining;
    const clock=Math.ceil(quiz.remaining)+' 秒';
    if($('quizClock').textContent!==clock) $('quizClock').textContent=clock;
    if(quiz.remaining===0) answerQuiz(null);
    return;
  }
  if(quiz.phase==='shot'){
    const done=cannon.tick(dt,G,{
      onStartFire:origin=>{
        document.body.classList.add('cannon-burst');
        $('quizResult').textContent='機關炮全力掃射！';
        burst(origin.x,origin.y,origin.z,0x9effff,16,5);
      },
      onShot:()=>{
        playGatlingBeat();
      },
      onEliminate:(batch,killedCount,totalTargets)=>{
        const step=Math.max(1,Math.ceil(batch.length/4));
        let sampled=0;
        for(let i=0;i<batch.length && sampled<4;i+=step){
          const enemy=batch[i];
          burst(enemy.x,.85,enemy.z,0xffdc84,reducedMotion.matches?1:3,6);
          sampled++;
        }
        $('quizResult').textContent='機關掃射中！已擊退 '+killedCount+' / '+totalTargets+' 名敵兵';
      },
      onFinishFire:totalKilled=>{
        document.body.classList.remove('cannon-burst');
        playCannonCooldown();
        $('quizResult').textContent='掃射完成！擊退 '+totalKilled+' 名敵兵';
      }
    });
    if(!done) return;
  }else{
    quiz.age+=dt;
    if(quiz.age<1.35) return;
  }
  clearQuiz();
  G.quizNext=G.t+R(...QUIZ_GAP);
}
function reviewQuiz(){
  $('quizReview').hidden=!cfg.quizSeconds;
  const missed=G.quizLog.filter(r=>r.chosen!==r.answer);
  $('quizScore').textContent='答對 '+(G.quizLog.length-missed.length)+'／'+G.quizLog.length+' 題';
  $('quizErrors').replaceChildren(...missed.map(r=>{
    const item=document.createElement('li');
    item.textContent=r.expression+' = '+r.answer+'（'+(r.chosen===null?'超時':'所選答案：'+r.chosen)+'）';
    return item;
  }));
}
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if (G && running && !paused && !G.over) {
    if(quiz?.phase!=='shot') step(dt);
    if(running) quizTick(now,dt);
  }
  render((running&&!paused)?dt:0);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------------- 介面 ----------------
const $=id=>document.getElementById(id);
function openStory(){
  const ch = CHAPTERS[cfg.level] || CHAPTERS['1'];
  $('storyBadge').textContent = ch.badge;
  $('storyTitle').textContent = ch.title;
  $('storyEnemy').src = ch.enemyImg;
  $('storyEnemy').alt = ch.title + '敵方強敵';
  $('storyText').textContent = ch.story;
  $('storyTip').textContent = ch.tip;
  landscape.setTheme(cfg.level);
  $('menu').style.display='none';
  $('endMenu').style.display='none';
  $('storyOverlay').style.display='flex';
}
function start(){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); actx.resume&&actx.resume(); }catch(e){}
  try{ localStorage.setItem('armyMathCfg2',JSON.stringify(cfg)); }catch(e){}
  newGame(); running=true; paused=false;
  $('menu').style.display='none'; $('storyOverlay').style.display='none'; $('endMenu').style.display='none';
  $('pauseBtn').style.display='block';
  $('hint').style.display='block';
}
function endGame(win){
  clearQuiz(); reviewQuiz();
  G.over=true; running=false; $('pauseBtn').style.display='none';
  if (win){
    saveMedal(cfg.level);
    burst(0,4,G.boss.z,0xffd23f,60,10); scene.remove(G.boss.grp);
    beep(523,0.15); setTimeout(()=>beep(659,0.15),150); setTimeout(()=>beep(784,0.3),300);
  }
  else beep(160,0.4,'sawtooth',0.05);
  setTimeout(()=>{
    const ch = G.chapter;
    const allWon = ['1','2','3'].every(k=>medals[k]);
    $('endTitle').textContent = win
      ? (cfg.level==='3' ? '全章通關！成功守護王國！' : `${ch.title}・勝利！`)
      : (G.army<=0 ? '軍隊全軍覆沒' : '首領衝過來了');
    const medalEl=$('endMedal');
    if (win) {
      medalEl.hidden=false;
      medalEl.textContent = allWon && cfg.level==='3'
        ? `獲得 ${ch.medalName} ・ 集齊三枚勳章！`
        : `獲得 ${ch.medalName}`;
    } else {
      medalEl.hidden=true;
    }
    const nextBtn=$('nextChapterBtn');
    const hasNext = win && (cfg.level==='1' || cfg.level==='2');
    nextBtn.hidden=!hasNext;
    if (hasNext) {
      const nextLv = cfg.level==='1' ? '2' : '3';
      nextBtn.textContent = `進入下一章（第${nextLv==='2'?'二':'三'}章・${CHAPTERS[nextLv].title}）`;
      nextBtn.onclick = () => {
        cfg.level = nextLv;
        syncOptionButtons();
        openStory();
      };
    }
    $('stMax').textContent=G.maxArmy; $('stAcc').textContent=`${G.good}/${G.total}`; $('stTime').textContent=Math.round(G.t);
    $('log').innerHTML = G.log.length ? G.log.slice(-40).map(l=>`<div class="${l.best?'ok':'no'}">${l.best?'✓':'✗'} ${l.line}${l.better?`（揀 ${l.better} 會更多）`:''}</div>`).join('') : '<div>未有選擇任何門</div>';
    $('endMenu').style.display='flex';
  }, win?900:600);
}
$('startBtn').onclick=openStory;
$('storyGoBtn').onclick=start;
$('storyBackBtn').onclick=()=>{ $('storyOverlay').style.display='none'; $('menu').style.display='flex'; };
$('againBtn').onclick=start;
$('homeBtn').onclick=()=>{ $('endMenu').style.display='none'; $('menu').style.display='flex'; };
function pauseGame(){
  if(!running || paused) return;
  if(quiz?.phase==='question' && quiz.deadline!==null){
    quiz.remaining=Math.max(0,(quiz.deadline-performance.now())/1000);quiz.deadline=null;
  }
  paused=true;dragging=false;$('pauseMenu').style.display='flex';
}
$('pauseBtn').onclick=pauseGame;
document.addEventListener('visibilitychange',()=>{if(document.hidden && cfg.quizSeconds) pauseGame();});
$('resumeBtn').onclick=()=>{ paused=false; $('pauseMenu').style.display='none'; };
$('quitBtn').onclick=()=>{ clearQuiz(); paused=false; running=false; $('pauseMenu').style.display='none'; $('pauseBtn').style.display='none'; $('menu').style.display='flex'; };
newGame();
})();
</script>
